name: Release artifacts
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix runner
      - run: ./gradlew check assemble
      - run: docker build -t ghcr.io/habicht12/nf-agent-codex:$(cat VERSION) runner
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914
        with:
          version: '26.10.2'
      - run: ./gradlew install
      - run: node validation/run.mjs
      - run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$PWD/validation/check-sandbox.mjs:/check-sandbox.mjs:ro"
          ghcr.io/habicht12/nf-agent-codex:$(cat VERSION) node /check-sandbox.mjs
      - name: Prepare release metadata
        run: node scripts/release-metadata.mjs
      - name: Publish image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/habicht12/nf-agent-codex:$(cat VERSION)"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo 'This runtime version already exists; release a new version.' >&2
            exit 1
          fi
          docker push "$image"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$(cat VERSION)" build/distributions/*
          --draft --title "$(cat VERSION) — Native Codex runner"
          --target "$GITHUB_SHA"
          --notes-file docs/release-notes.md
