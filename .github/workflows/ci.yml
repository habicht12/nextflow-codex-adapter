name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nextflow: ['26.10.0', '26.10.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix runner
      - run: ./gradlew check install
      - run: docker build -t ghcr.io/habicht12/nf-agent-codex:$(cat VERSION) runner
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914
        with:
          version: ${{ matrix.nextflow }}
      - run: node validation/run.mjs
      - name: Verify actual Codex sandbox without model access
        run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$PWD/validation/check-sandbox.mjs:/check-sandbox.mjs:ro"
          ghcr.io/habicht12/nf-agent-codex:$(cat VERSION) node /check-sandbox.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.nextflow }}
          path: |
            build/reports/tests/
            build/test-results/
            /tmp/nf-codex-integration-*/nextflow.log

